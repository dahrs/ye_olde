name: Deploy Search API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "search_api/**"
      - ".github/workflows/deploy-search-api.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation — no long-lived key stored

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ye-olde-search-api
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          source: search_api
          env_vars: |
            HF_DATASET_REPO_ID=${{ vars.HF_DATASET_REPO_ID }}
          # HF_TOKEN comes from Secret Manager (secret "hf-token"), not a GitHub
          # secret — needed even though the dataset repo is public: Hugging
          # Face rate-limits fully anonymous API reads (discovered live, see
          # docs §10). --allow-unauthenticated re-asserts public invocation on
          # every deploy, since a from-scratch service otherwise defaults to
          # private and this isn't part of the revision spec gcloud preserves
          # automatically for an existing one.
          secrets: |
            HF_TOKEN=hf-token:latest
          flags: --allow-unauthenticated

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
