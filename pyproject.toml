[project]
name = "ye_olde"
version = "0.1.0"
description = "A language translator using highly modern tools where the focus is on old and ancient languages."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
retrieval = [
    "sentence-transformers>=3",
]
generation = [
    "litellm>=1",
]
contrib = [
    "jsonschema>=4",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ye_olde"]
