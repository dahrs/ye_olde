[tool.mypy]
# Checked against the interpreter mypy actually runs under, not this
# service's own requires-python floor (3.11) — numpy's bundled stubs
# (pulled in transitively via faiss-cpu/sentence-transformers now) use PEP
# 695 `type` statement syntax mypy only parses under python_version >= 3.12.
# Same reasoning as the root project's pyproject.toml.
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/"]

# search_api runs in its own environment (requirements.txt, not the root
# project's uv-managed venv — see app/config.py's docstring for why it's a
# separate deployable), so its mypy config is scoped here rather than in the
# root pyproject.toml, and is run with this directory as the working
# directory (see README.md "Local development").
[[tool.mypy.overrides]]
module = ["pyarrow.*", "faiss.*", "sentence_transformers.*"]
ignore_missing_imports = true

# huggingface_hub ships types but doesn't declare `utils`' re-exports (e.g.
# EntryNotFoundError, RepositoryNotFoundError) in an `__all__`, which
# strict mode's implicit-reexport check otherwise flags as a false positive.
[[tool.mypy.overrides]]
module = ["huggingface_hub.utils"]
implicit_reexport = true
