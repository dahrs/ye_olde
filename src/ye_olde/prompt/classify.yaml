# Prompts for src/ye_olde/classify/*.py — loaded via ye_olde.prompt.load_prompt("classify", <key>).
# Edit wording here; do not touch the Python modules that use these to change what the model is told.
#
# Same UD-style tagging technique ingest/align.py's word-alignment call
# already uses (spec §3d) -- applied here to a live input sentence at
# translate() query time instead of corpus text at indexing time. The tag
# vocabularies below are intentionally identical to prompt/ingest.yaml's, so
# a token tagged e.g. "Robin PROPN" at query time matches an identically
# tagged indexed token, not a lexical-only match against an unrelated word.

classify_system: |-
  You are tagging every token of one sentence from a historical or modern language, so a retrieval system can look up each word's attested form at another point in that language's history using the right grammatical/semantic category — not just its literal spelling.

  You will be given the sentence's language code and its tokens, already split and numbered in order. For EACH numbered token, in the same order, return one tag object with these fields. Use ONLY tags from these exact closed lists — never invent a variant spelling or a tag not listed:
  - "text": the token's exact surface text, copied verbatim from the numbered list (do not correct spelling, do not modernize).
  - "lemma": the token's dictionary citation form, in its own language (do not translate).
  - "upos": exactly one of ADJ, ADP, ADV, AUX, CCONJ, DET, INTJ, NOUN, NUM, PART, PRON, PROPN, PUNCT, SCONJ, SYM, VERB, X (Universal Dependencies' UPOS tag set).
  - "feats": morphological features as "Attr=Value" pairs joined by "|" (e.g. "Case=Nom|Number=Sing|Gender=Masc"), drawing attribute names from Case, Gender, Number, Person, Tense, Mood, Voice, Degree, Definite, PronType, VerbForm — or "" if nothing applies (most function words).
  - "deprel": exactly one Universal Dependencies core relation: nsubj, obj, iobj, csubj, ccomp, xcomp, obl, vocative, expl, dislocated, advcl, advmod, discourse, aux, cop, mark, nmod, appos, nummod, acl, amod, det, clf, case, conj, cc, fixed, flat, compound, list, parataxis, orphan, goeswith, reparandum, punct, root, or dep (only if truly none of the others fit).
  - "ner": exactly one of PER (person name), LOC (place name), ORG (organization/institution), MISC (other proper name — deity, work title, ...), or O (not a named entity). A name (PER/LOC/ORG/MISC) is a token that identifies one specific person, place, organization, or other named thing — not a common noun, even a capitalized one at a sentence start.
  - "lemma_confidence"/"upos_confidence"/"feats_confidence"/"deprel_confidence": your confidence in each of "lemma"/"upos"/"feats"/"deprel" above, one number per tag, per the "Confidence scoring" definition below. Omit a field's confidence entirely if you omitted that field itself (e.g. no "feats_confidence" when "feats" is "").

  Reply with ONLY a JSON array, exactly the same length and order as the numbered input tokens, one tag object per token — no prose, no markdown code fence, no merging or splitting tokens.
