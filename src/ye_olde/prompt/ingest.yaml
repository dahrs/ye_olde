# Prompts for src/ye_olde/ingest/*.py — loaded via ye_olde.prompt.load_prompt("ingest", <key>).
# Edit wording here; do not touch the Python modules that use these to change what the model is told.
#
# align_system and links_system both repeat the same "annotation tags" block
# verbatim (spec §3d) rather than sharing it via a YAML anchor/alias: an
# alias only substitutes at the YAML-node level, not textually inside
# another block scalar's string content — tried, confirmed it doesn't work,
# duplicating the text is the actual working option.

clean_system: |-
  You are preparing historical literary texts for a diachronic translation corpus. You will be given one chunk of raw, OCR/transcribed text from a single edition of a single work. Your job is close reading and filtering, never translation, modernization, or rewriting.

  Discard (do not include in your output):
  - Publisher/distributor boilerplate (licenses, donation appeals, catalog info).
  - Editorial front matter: prefaces, introductions, dedications, tables of contents.
  - Editorial back matter: notes, glossary, index, appendices, colophons.
  - Footnote/endnote markers and their bodies, sidenotes, folio/manuscript references (e.g. "[Fol. 91a.]", "[Sidenote: ...]", superscript note numbers).
  - Page furniture: running headers/footers, standalone page numbers, printer's marks, section rules.
  - Transcriber/editor bracketed commentary about the transcription itself.

  Keep, verbatim (do not correct spelling, do not modernize, do not translate):
  - The actual narrative/poetic/philosophical/legal content of the work itself.
  - Structural labels that are part of the work's own content (e.g. "Fitt the First", "Book I", chapter or verse numbers, stanza numbers) — keep these attached to the unit they introduce, not as separate units.

  Split the kept content into an ordered list of short units — one sentence, or for verse, one natural clause/line-group — preserving the original order and exact original wording. If a unit carries a structural label, prefix the unit's text with that label followed by " — ".

  Reply with ONLY a JSON array of strings, no prose, no markdown code fence. If this entire chunk is front/back matter with nothing to keep, reply with an empty JSON array: []

align_system: |-
  You are building a sentence-level parallel corpus (bitext) from two editions of the same work, written at different points in the language's history, so a diachronic-translation retrieval system can look up "how was this word or phrase rendered at the other point in time" the way Linguee does for modern language pairs.

  You will be given two ordered lists of content units: SOURCE units and TARGET units. Both are excerpts of the same work and should express the same content in roughly the same order, though wording, sentence boundaries, and structural labels may differ between the two editions.

  For every place where you can confidently match a stretch of SOURCE content to a stretch of TARGET content (they express the same statement, clause, or verse), emit one aligned pair with these fields:
  - "source_text": the exact verbatim excerpt from the SOURCE units expressing that content (copy character-for-character; do not paraphrase, correct spelling, or translate).
  - "target_text": the exact verbatim excerpt from the TARGET units expressing the same content, same rule.
  - "citation": a structural label attached to this content in either edition (e.g. "Fitt I", "Genesis 1:3", "Book II, ch. 3"), or null if none is present.
  - "confidence": your confidence, 0.0-1.0, that this is a faithful and correctly-bounded match.
  - "links": 1-8 word- or short-phrase-level correspondences within this pair worth highlighting for a learner (an attested form in SOURCE next to its counterpart in TARGET), each `{"source_span": "...", "target_span": "..."}` where both spans are exact verbatim substrings of source_text/target_text respectively, PLUS the annotation fields below. Prefer content words (nouns, verbs, notable archaic forms, proper names) over function words. Omit a link rather than guessing at it.

  For each link, also annotate the SOURCE span's and TARGET span's head word (the single word that carries the link's meaning — for a multi-word span, pick its grammatical head) with these closed tag vocabularies. Use ONLY tags from these exact lists — never invent a variant spelling or a tag not listed:
  - "source_upos"/"target_upos": exactly one of ADJ, ADP, ADV, AUX, CCONJ, DET, INTJ, NOUN, NUM, PART, PRON, PROPN, PUNCT, SCONJ, SYM, VERB, X (Universal Dependencies' UPOS tag set).
  - "source_feats"/"target_feats": morphological features as "Attr=Value" pairs joined by "|" (e.g. "Case=Nom|Number=Sing|Gender=Masc"), drawing attribute names from Case, Gender, Number, Person, Tense, Mood, Voice, Degree, Definite, PronType, VerbForm — or "" if nothing applies (e.g. most function words).
  - "source_deprel"/"target_deprel": exactly one Universal Dependencies core relation: nsubj, obj, iobj, csubj, ccomp, xcomp, obl, vocative, expl, dislocated, advcl, advmod, discourse, aux, cop, mark, nmod, appos, nummod, acl, amod, det, clf, case, conj, cc, fixed, flat, compound, list, parataxis, orphan, goeswith, reparandum, punct, root, or dep (only if truly none of the others fit).
  - "source_ner"/"target_ner": exactly one of PER (person name), LOC (place name), ORG (organization/institution), MISC (other proper name — deity, work title, ...), or O (not a named entity).
  - "source_lemma"/"target_lemma": the word's dictionary citation form, in its own language (do not translate or modernize it).
  - "sense_gloss": for a content-word link only (upos NOUN/PROPN/VERB/ADJ/ADV), a short English definition of the shared concept both spans express — written the way a dictionary entry would define it, in English regardless of which language the link is in, e.g. "the visual effect of illumination on objects" for a "light" link. Omit for function-word links (DET, ADP, AUX, ...).
  - "source_lemma_confidence"/"source_upos_confidence"/"source_feats_confidence"/"source_deprel_confidence" (and the matching "target_..." fields): your confidence in each of the four tags above, one number per tag, per the "Confidence scoring" definition below. Omit a field's confidence entirely if you omitted that field itself (e.g. no "source_feats_confidence" when "source_feats" is "").

  Skip content you cannot confidently align rather than forcing a low-quality match — a smaller correct bitext is more useful than a larger noisy one. Reply with ONLY a JSON array of pair objects (can be empty if nothing in these two blocks matches), no prose, no markdown code fence.

links_system: |-
  You are given several already-matched sentence/verse pairs from two editions of the same work, written at different points in the language's history. The sentence-level matching is already decided and correct — your only job is word/phrase-level linking within each given pair.

  For each pair, propose 1-8 word- or short-phrase-level correspondences worth highlighting for a learner (an attested form on the SOURCE side next to its counterpart on the TARGET side), each `{"source_span": "...", "target_span": "..."}` PLUS the annotation fields below. Prefer content words (nouns, verbs, notable archaic forms, proper names) over function words. Omit a link rather than guessing at it.

  For each link, also annotate the SOURCE span's and TARGET span's head word (the single word that carries the link's meaning — for a multi-word span, pick its grammatical head) with these closed tag vocabularies. Use ONLY tags from these exact lists — never invent a variant spelling or a tag not listed:
  - "source_upos"/"target_upos": exactly one of ADJ, ADP, ADV, AUX, CCONJ, DET, INTJ, NOUN, NUM, PART, PRON, PROPN, PUNCT, SCONJ, SYM, VERB, X (Universal Dependencies' UPOS tag set).
  - "source_feats"/"target_feats": morphological features as "Attr=Value" pairs joined by "|" (e.g. "Case=Nom|Number=Sing|Gender=Masc"), drawing attribute names from Case, Gender, Number, Person, Tense, Mood, Voice, Degree, Definite, PronType, VerbForm — or "" if nothing applies (e.g. most function words).
  - "source_deprel"/"target_deprel": exactly one Universal Dependencies core relation: nsubj, obj, iobj, csubj, ccomp, xcomp, obl, vocative, expl, dislocated, advcl, advmod, discourse, aux, cop, mark, nmod, appos, nummod, acl, amod, det, clf, case, conj, cc, fixed, flat, compound, list, parataxis, orphan, goeswith, reparandum, punct, root, or dep (only if truly none of the others fit).
  - "source_ner"/"target_ner": exactly one of PER (person name), LOC (place name), ORG (organization/institution), MISC (other proper name — deity, work title, ...), or O (not a named entity).
  - "source_lemma"/"target_lemma": the word's dictionary citation form, in its own language (do not translate or modernize it).
  - "sense_gloss": for a content-word link only (upos NOUN/PROPN/VERB/ADJ/ADV), a short English definition of the shared concept both spans express — written the way a dictionary entry would define it, in English regardless of which language the link is in, e.g. "the visual effect of illumination on objects" for a "light" link. Omit for function-word links (DET, ADP, AUX, ...).
  - "source_lemma_confidence"/"source_upos_confidence"/"source_feats_confidence"/"source_deprel_confidence" (and the matching "target_..." fields): your confidence in each of the four tags above, one number per tag, per the "Confidence scoring" definition below. Omit a field's confidence entirely if you omitted that field itself (e.g. no "source_feats_confidence" when "source_feats" is "").

  Reply with ONLY a JSON array, the same length and in the same order as the numbered input pairs, where item k is the list of links for pair k (an empty list is fine for a pair with no confident links). Every span must be an exact verbatim substring of that pair's own source/target text — no prose, no markdown code fence.

pair_review_system: |-
  You are double-checking sentence-pair alignments already produced (by you or an earlier pass of this pipeline) before they're used as reference examples. You will be given several numbered pairs, each with its source text, target text, and citation.

  If a pair already looks correct — source_text and target_text genuinely express the same content, nothing is truncated, garbled, or mismatched — leave it completely unchanged. Do not rephrase, "improve," or modernize either side even slightly; do not correct spelling. Perfection means an output identical to the input.

  Only fix a pair with an actual, clear defect (target_text doesn't match source_text's content at all, obviously truncated/garbled text, a citation that's clearly wrong). Any corrected source_text/target_text you give must still be an exact excerpt of that side's original wording — never invent or paraphrase replacement text.

  Reply with ONLY a JSON array, the same length and order as the numbered input pairs: `[{"source_text": "...", "target_text": "...", "citation": ...}, ...]` — for an unchanged pair, repeat its source_text/target_text/citation exactly as given. No prose, no markdown code fence.

clean_review_system: |-
  You are double-checking your own prior work before it is used. You will be given a numbered list of content units already extracted and filtered from a historical text (front/back matter, footnotes, and page furniture should already be gone).

  Review each unit for a genuine, clear defect: leftover editorial/note material that should have been removed, a truncated or garbled unit, an obvious transcription artifact, or a unit that was accidentally split or merged wrong. If a unit already has no defect, leave it completely unchanged — do not rephrase, "improve," modernize, or otherwise touch a unit that is already correct. Perfection means an output identical to the input.

  Reply with ONLY a JSON array of strings, the same length and order as the input, one corrected (or, usually, unchanged) string per input unit. No prose, no markdown code fence.

propose_filename_system: |-
  You are naming a file for a corpus of historical literary texts, each a single edition/translation of a single work. You will be given the source URL it was fetched from and an excerpt of the actual fetched content (its title page, front matter, or opening lines). Your job is to identify five facts about THIS SPECIFIC EDITION from that excerpt — never guess from the URL alone if the excerpt contradicts or adds to it.

  Reply with ONLY a JSON object with exactly these five string fields, no prose, no markdown code fence:
  - "lang_code": the ISO 639-3 code (lowercase, 3 letters) for the language this edition's text is actually written in — e.g. "ang" (Old English), "enm" (Middle English), "eng" (Modern English), "lat" (Latin), "fro" (Old French), "grc" (Ancient Greek). Judge this from the excerpt's own language, not the site's language.
  - "year": the four-digit year THIS edition/translation was first published or written — not the website's copyright year, not a scan/upload date, and not today's year. For the original-language text of a very old work, use its traditional composition/attestation year if that's what the excerpt itself cites. If the excerpt genuinely gives no usable year, give your best-informed estimate rather than a placeholder, since every file in this corpus needs one.
  - "title": the work's title, in the original capitalization you'd use in running prose (this will be mechanically turned into a filename afterward — don't pre-format it, don't abbreviate it).
  - "author": the author of the original work, or — if this excerpt is itself a translation/edition by someone else — the translator or editor named for THIS edition specifically (prefer the more specific one over the original author when the excerpt distinguishes them). Use "unknown" if the excerpt gives no name at all.
  - "source": the name of the site or archive this was fetched from (e.g. "Project Gutenberg", "Internet Archive", "Poetry Foundation"), as a short human-readable proper name — infer it from the URL's domain plus anything the excerpt itself says about where it was published online.

  Every field must be non-empty. If you are genuinely unsure of a field, give your single best-informed guess rather than a placeholder like "unknown" or "n/a" — the one exception is "author", where "unknown" is an acceptable, expected answer for genuinely anonymous works.
